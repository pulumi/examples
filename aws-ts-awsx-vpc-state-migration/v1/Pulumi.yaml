name: awsx-vpc-state-migration
runtime: nodejs
description: The classic AWSX VPC state used as the migration starting point
template:
  config:
    aws:region:
      description: The AWS region to deploy into
      default: us-west-2
    availabilityZone:
      description: An availability zone in the configured AWS region (keep it unchanged between versions)
      default: us-west-2a
