name: pulumi-ansible-wordpress-java
runtime: java
description: Deploy an EC2 Wordpress server using Pulumi and Ansible.
template:
  config:
    aws:region:
      description: The AWS region to deploy into
      default: us-east-1
    publicKeyPath:
      description: Path to the SSH public key used to access the EC2 instance
    privateKeyPath:
      description: Path to the SSH private key used to access the EC2 instance
    dbPassword:
      description: The password for the Wordpress RDS database
      secret: true
    dbInstanceSize:
      description: The RDS instance size to use
      default: db.t3.small
    dbName:
      description: The name of the Wordpress database in RDS
      default: wordpressdb
    dbUsername:
      description: The name of the Wordpress database user
      default: admin
    ec2InstanceSize:
      description: The EC2 instance size to provision
      default: t3.small
