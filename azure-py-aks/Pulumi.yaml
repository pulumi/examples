name: azure-py-aks
runtime:
  name: python
  options:
    virtualenv: venv
description: Using the native Azure provider to create AKS cluster with python
template:
  config:
    azure-native:location:
      description: The Azure location to deploy into
      default: westus2
    managedClusterName:
      description: The name to use for the managed AKS cluster
