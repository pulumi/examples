name: aws-ts-langserve
runtime: nodejs
description: A minimal Langserve AWS TypeScript Pulumi program
config:
  pulumi:tags:
    value:
      pulumi:template: https://github.com/pulumi/templates/tree/dirien/langserve-aws/langserve-aws-typescript
template:
  config:
    aws:region:
      description: The AWS region to deploy into
      default: us-west-2
    vpc-cidr:
      description: The CIDR block for the VPC
      default: 10.0.0.0/16
    subnet-1-cidr:
      description: The CIDR block for the first subnet
      default: 10.0.0.0/24
    subnet-2-cidr:
      description: The CIDR block for the second subnet
      default: 10.0.1.0/24
    container-context:
      description: The Docker build context
      default: .
    container-file:
      description: The path to the Dockerfile
      default: ./Dockerfile
    open-api-key:
      description: Your OpenAI API key
      secret: true
