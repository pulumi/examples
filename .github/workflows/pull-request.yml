permissions: write-all # Equivalent to default permissions plus id-token: write
env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: imports/github-secrets
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false
  PULUMI_ENABLE_JOURNALING: "true"
name: Pull request
on:
  pull_request:
    branches:
      - master

# Deliberately no `concurrency: cancel-in-progress`. Cancelling a job mid-`pulumi up`
# orphans real cloud resources with no `pulumi destroy` to clean them up.

jobs:
  # Works out which examples this PR touched, and which integration test sets need to run as
  # a result. Everything the PR did not touch is left to the nightly sweep in
  # test-examples.yml. Needs no secrets, so it finishes in seconds.
  changes:
    name: Detect changed examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed-paths: ${{ steps.changed.outputs.changed-paths }}
      test-sets: ${{ steps.changed.outputs.test-sets }}
      run-kubernetes: ${{ steps.changed.outputs.run-kubernetes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # The script diffs against the PR base, which needs more than a shallow checkout.
          fetch-depth: 0

      - name: Detect changed examples
        id: changed
        run: bash scripts/changed-examples.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  lint-ts:
    name: TypeScript lint checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@197ccaa42ab49560ce838a3010eb8345ce086896 # v1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up the environment
        uses: ./.github/actions/setup
        id: setup
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-role-to-assume: ${{ steps.esc-secrets.outputs.AWS_CI_ROLE_ARN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ESLint
        run: npm ci

      - name: Lint
        run: npx eslint .

  unit-ts:
    name: TypeScript unit tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@197ccaa42ab49560ce838a3010eb8345ce086896 # v1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up the environment
        uses: ./.github/actions/setup
        id: setup
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-role-to-assume: ${{ steps.esc-secrets.outputs.AWS_CI_ROLE_ARN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: unit tests
        working-directory: testing-unit-ts/mocha
        run: |
          npm install
          npm test

  format-py:
      name: Python Code Format and Validation
      runs-on: ubuntu-latest

      steps:
        # Step 1: Checkout the repository
        - name: Checkout Code
          uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

        # Step 2: Set up Python
        - name: Set up Python
          uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
          with:
            python-version: 3.9 # Adjust the version as needed

        # Step 3: Install Make (already installed on Ubuntu, but explicit just in case)
        - name: Ensure Make is Installed
          run: |
            sudo apt-get update
            sudo apt-get install -y make

        # Step 4: Run Makefile targets
        - name: Run Make Targets
          run: |
            make check_python_formatting

  unit-py:
    name: Python unit tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@197ccaa42ab49560ce838a3010eb8345ce086896 # v1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up the environment
        uses: ./.github/actions/setup
        id: setup
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-role-to-assume: ${{ steps.esc-secrets.outputs.AWS_CI_ROLE_ARN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: unit tests
        working-directory: testing-unit-py
        run: |
          pulumi install
          venv/bin/python -m unittest -v

  unit-go:
    name: Go unit tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@197ccaa42ab49560ce838a3010eb8345ce086896 # v1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up the environment
        uses: ./.github/actions/setup
        id: setup
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-role-to-assume: ${{ steps.esc-secrets.outputs.AWS_CI_ROLE_ARN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: unit tests
        working-directory: testing-unit-go
        run: go test

      # Guards the PR-scoping mechanism itself: the path-matching helper that decides which
      # examples run, plus a build of the full suite so a bad test edit fails here rather
      # than inside a provider job minutes later.
      - name: Test harness unit tests
        working-directory: misc/test
        run: |
          go build -tags all ./...
          go test ./helpers/...

  unit-dotnet:
    name: .NET unit tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@197ccaa42ab49560ce838a3010eb8345ce086896 # v1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up the environment
        uses: ./.github/actions/setup
        id: setup
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-role-to-assume: ${{ steps.esc-secrets.outputs.AWS_CI_ROLE_ARN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: unit tests
        working-directory: ${{ matrix.source-dir }}
        run: |
          dotnet test

    strategy:
      fail-fast: false
      matrix:
        source-dir:
          - testing-unit-cs
          - testing-unit-cs-mocks
          - testing-unit-fs-mocks

  providers:
    name: ${{ matrix.test-set }} integration tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.test-sets != '[]'
    permissions:
      id-token: write
      contents: read

    steps:
      # Run as first step so we don't delete things that have just been installed
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@197ccaa42ab49560ce838a3010eb8345ce086896 # v1
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          swap-storage: false
          dotnet: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up the environment
        uses: ./.github/actions/setup
        id: setup
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-role-to-assume: ${{ steps.esc-secrets.outputs.AWS_CI_ROLE_ARN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: make specific_test_set TestSet=${{ matrix.test-set }}
        env:
          # Narrows the run from every test in this set to just the examples the PR touched.
          # `make specific_test_set` filters by an unanchored `TestAcc<Set>` prefix, so
          # without this a one-example change would still deploy the whole set.
          PULUMI_CHANGED_PATHS: ${{ needs.changes.outputs.changed-paths }}
          AWS_ACCESS_KEY_ID: ${{ steps.setup.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.setup.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.setup.outputs.aws-session-token }}
          AWS_REGION: ${{ steps.setup.outputs.aws-region }}
          ARM_CLIENT_ID: ${{ steps.esc-secrets.outputs.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ steps.esc-secrets.outputs.ARM_CLIENT_SECRET }}
          ARM_ENVIRONMENT: public
          ARM_LOCATION: westus
          ARM_SUBSCRIPTION_ID: ${{ steps.esc-secrets.outputs.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ steps.esc-secrets.outputs.ARM_TENANT_ID }}
          GOOGLE_PROJECT: ${{ steps.setup.outputs.google-project-name }}
          GOOGLE_REGION: ${{ steps.setup.outputs.google-region }}
          GOOGLE_ZONE: ${{ steps.setup.outputs.google-zone }}
          DIGITALOCEAN_TOKEN: ${{ steps.esc-secrets.outputs.DIGITALOCEAN_TOKEN }}
          PULUMI_ACCESS_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_ACCESS_TOKEN_STAGING }}
          PULUMI_API: https://api.pulumi-staging.io
          SLACK_WEBHOOK_URL: ${{ steps.esc-secrets.outputs.SLACK_WEBHOOK_URL }}

    strategy:
      fail-fast: false
      matrix:
        test-set: ${{ fromJson(needs.changes.outputs.test-sets) }}

  kubernetes:
    name: Kubernetes integration tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run-kubernetes == 'true'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@197ccaa42ab49560ce838a3010eb8345ce086896 # v1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up the environment
        uses: ./.github/actions/setup
        id: setup
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-role-to-assume: ${{ steps.esc-secrets.outputs.AWS_CI_ROLE_ARN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Minikube
        uses: manusa/actions-setup-minikube@5d9440a1b535e8b4f541eaac559681a9022df29d # v2.13.1
        with:
          minikube version: 'v1.34.0'
          kubernetes version: 'v1.31.1'
          driver: docker
          start args: --cpus 2 --memory 4096 --addons metallb --wait all

      - name: Configure MetalLB
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            namespace: metallb-system
            name: config
          data:
            config: |
              address-pools:
              - name: default
                protocol: layer2
                addresses:
                - 192.168.49.240-192.168.49.250
          EOF

      - name: Run tests
        run: |
          make specific_test_set TestSet=Kubernetes

        env:
          # The guestbook examples are split into simple/ and components/ subprojects, so
          # this also keeps a change to one of them from deploying its sibling.
          PULUMI_CHANGED_PATHS: ${{ needs.changes.outputs.changed-paths }}
          AWS_ACCESS_KEY_ID: ${{ steps.setup.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.setup.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.setup.outputs.aws-session-token }}
          AWS_REGION: ${{ steps.setup.outputs.aws-region }}
          PULUMI_ACCESS_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_ACCESS_TOKEN_STAGING }}
          PULUMI_API: https://api.pulumi-staging.io
          INFRA_STACK_NAME: ${{ github.sha }}-${{ github.run_number }}

  # A single, stable-named check summarising the integration jobs. The provider matrix is
  # generated per-PR, so its job names vary from run to run and can't be required directly.
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [changes, providers, kubernetes]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "changes:    ${{ needs.changes.result }}"
          echo "providers:  ${{ needs.providers.result }}"
          echo "kubernetes: ${{ needs.kubernetes.result }}"

          # `skipped` is the expected result when a PR touches no example of that kind.
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::One or more integration test jobs did not pass."
            exit 1
          fi
