name: voting-app
runtime: nodejs
description: Voting app that uses containers
template:
  config:
    aws:region:
      description: The AWS region to deploy into
      default: us-west-2
    sql-admin-name:
      description: The username for the database admin user
    sql-admin-password:
      description: The password for the database admin user
      secret: true
    sql-user-name:
      description: The username for the application database user
    sql-user-password:
      description: The password for the application database user
      secret: true
