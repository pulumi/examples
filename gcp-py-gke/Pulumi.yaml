name: gcp-py-gke
description: A Google Kubernetes Engine (GKE) cluster, with canary deployment
runtime:
  name: python
  options:
    virtualenv: venv
template:
  config:
    gcp:project:
      description: The Google Cloud project to deploy into
    gcp:zone:
      description: The Google Cloud zone to deploy into
      default: us-west1-a
    username:
      description: The username for the GKE cluster
      default: admin
    password:
      description: The password for the GKE cluster
      secret: true
    master_version:
      description: The Kubernetes master version to use
    node_count:
      description: The number of cluster nodes
      default: 3
    node_machine_type:
      description: The machine type to use for cluster nodes
      default: n1-standard-1
