name: aws-py-delivery-ecs-beta
description: Runs the example app image on ECS Fargate behind an Application Load Balancer
runtime:
  name: python
  options:
    toolchain: pip
    virtualenv: venv
template:
  config:
    aws:region:
      description: The AWS region to deploy into
      default: us-west-2
    aws-native:region:
      description: The AWS region for the load balancer's listener rule, the same as aws:region
      default: us-west-2
