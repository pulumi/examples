<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AICR Chatbot</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --border: #2a2f3d; --text: #e6e8ef; --muted: #8b91a5;
    --user: #1f3a5f; --bot: #1d2230; --accent: #76b900; --error: #e5484d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
           display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { color: var(--muted); font-size: 13px; }
  header .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
                background: var(--muted); margin-right: 6px; vertical-align: middle; }
  header .dot.ready { background: var(--accent); }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 140px; }
  .msg { padding: 12px 16px; border-radius: 12px; margin: 10px 0; white-space: pre-wrap;
         word-wrap: break-word; max-width: 85%; }
  .msg.user { background: var(--user); margin-left: auto; }
  .msg.bot { background: var(--bot); border: 1px solid var(--border); }
  .msg.error { border-color: var(--error); color: var(--error); }
  .msg .stats { display: block; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  form { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
         border-top: 1px solid var(--border); padding: 14px 16px; }
  form .row { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  textarea { flex: 1; resize: none; min-height: 48px; max-height: 160px; padding: 12px 14px;
             border-radius: 10px; border: 1px solid var(--border); background: var(--bg);
             color: var(--text); font: inherit; }
  button { padding: 0 20px; border-radius: 10px; border: 0; background: var(--accent);
           color: #10160a; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 860px; margin: 8px auto 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>AICR Chatbot</h1>
  <span class="meta"><span class="dot" id="dot"></span><span id="model">loading…</span></span>
  <span class="meta" id="served"></span>
</header>

<main id="log">
  <!-- Bubbles are white-space: pre-wrap, so keep this text on one line. -->
  <div class="msg bot">Hi! Ask me anything. Answers are generated by an open-weight model served by NVIDIA Dynamo on a GPU cluster whose software stack was deployed by the Pulumi NVIDIA AICR provider.</div>
</main>

<form id="form">
  <div class="row">
    <textarea id="input" placeholder="Ask a question… (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </div>
  <div class="hint">No login, no history saved. Refresh the page to start over.</div>
</form>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const history = [];   // {role, content} turns sent back to the model for context
  let inFlight = false; // one question at a time, so history stays paired

  async function loadInfo() {
    try {
      const r = await fetch("/api/info");
      const info = await r.json();
      document.getElementById("model").textContent = info.model;
      document.getElementById("served").textContent = "served by " + info.served_by;
      document.getElementById("dot").classList.toggle("ready", info.llm_ready);
      if (!info.llm_ready) setTimeout(loadInfo, 5000);
    } catch (e) { setTimeout(loadInfo, 5000); }
  }
  loadInfo();
  input.focus();

  function bubble(cls, text) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    log.appendChild(div);
    div.scrollIntoView({ block: "end" });
    return div;
  }

  async function ask(question) {
    bubble("user", question);
    history.push({ role: "user", content: question });
    const bot = bubble("bot cursor", "");
    let answer = "";
    let failed = false;

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      if (!r.ok || !(r.headers.get("content-type") || "").startsWith("text/event-stream")) {
        throw new Error(`HTTP ${r.status} ${(await r.text()).slice(0, 200)}`);
      }
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const line = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 2);
          if (!line.startsWith("data:")) continue;
          const ev = JSON.parse(line.slice(5));
          if (ev.delta) {
            answer += ev.delta;
            bot.textContent = answer;
            bot.scrollIntoView({ block: "end" });
          } else if (ev.error) {
            bot.classList.add("error");
            bot.textContent = ev.error;
            failed = true;
          } else if (ev.done) {
            const stats = document.createElement("span");
            stats.className = "stats";
            const tps = ev.seconds > 0 ? (ev.tokens / ev.seconds).toFixed(1) : "–";
            stats.textContent = `${ev.tokens} tokens · ${ev.seconds}s · ${tps} tok/s`;
            bot.appendChild(stats);
          }
        }
      }
    } catch (e) {
      bot.classList.add("error");
      bot.textContent = "Request failed: " + e.message;
      failed = true;
    }
    bot.classList.remove("cursor");
    if (failed) {
      history.pop();                          // drop the unanswered question
    } else if (answer) {
      history.push({ role: "assistant", content: answer });
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || inFlight) return;
    inFlight = true;
    input.value = "";
    send.disabled = true;
    try { await ask(q); } finally {
      inFlight = false;
      send.disabled = false;
      input.focus();
    }
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
</script>
</body>
</html>
